# Exclusive keyboard focus makes Hyprland refuse focus requests from
# elephant's window integration (raising an open app warps the cursor but
# neither focuses it nor switches workspace). OnDemand keeps that working.
# See hyprwm/Hyprland#4829, abenz1267/walker#139.
selection_wrap = true
hide_action_hints = true

[placeholders]
"default" = { input = " Search...", list = "No Results" }

[keybinds]
quick_activate = []

[columns]
symbols = 1

[providers]
max_results = 256
default = ["desktopapplications", "websearch"]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"
[[providers.prefixes]]
prefix = "."
provider = "files"
[[providers.prefixes]]
prefix = ":"
provider = "symbols"
[[providers.prefixes]]
prefix = "="
provider = "calc"
[[providers.prefixes]]
prefix = "@"
provider = "websearch"
[[providers.prefixes]]
prefix = "$"
provider = "clipboard"
